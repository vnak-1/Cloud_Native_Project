services:
  registration-service:
    image: vnak3/registration-service:v1.0
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3001"
      SERVICE_NAME: registration-service
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  login-service:
    image: vnak3/login-service:v1.0
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3002"
      SERVICE_NAME: login-service
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
