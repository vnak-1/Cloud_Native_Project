services:
  equipment-1:
    image: vnak3/equipment-service:v1.0
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3003"
      SERVICE_NAME: equipment-service
      INSTANCE_ID: equipment-1
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  equipment-2:
    image: vnak3/equipment-service:v1.0
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3003"
      SERVICE_NAME: equipment-service
      INSTANCE_ID: equipment-2
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  equipment-lb:
    image: vnak3/equipment-lb:v1.0
    init: true
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      equipment-1:
        condition: service_healthy
        restart: true
      equipment-2:
        condition: service_healthy
        restart: true
