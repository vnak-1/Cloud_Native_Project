# Runs the whole EquipHub system on one machine, for local testing.
#   Start:  docker compose up --build     (stays in the foreground; Ctrl+C stops everything)
#
# Each service reads its secrets from its own .env file (create them first with
# scripts/setup-local-env.sh, or copy each .env.example to .env). Service URLs and
# INSTANCE_ID are set below under "environment:", which wins over the same names in .env.
#
# Clients should only use the gateway on port 3000. Ports 3001, 3002, 3004 and 8080 are
# published here only so you can show that calling a service directly is refused.

services:
  gateway:
    build: ./gateway
    image: vnak3/gateway:v1.0
    init: true # a tiny init process starts first, so stop signals reach Node properly
    env_file: ./gateway/.env
    environment:
      # Inside Docker, services find each other by their service name
      REGISTRATION_URL: http://registration-service:3001
      LOGIN_URL: http://login-service:3002
      EQUIPMENT_URL: http://equipment-lb:8080 # the load balancer, never a replica
      LOAN_URL: http://loan-service:3004
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      registration-service:
        condition: service_healthy
      login-service:
        condition: service_healthy
      equipment-lb:
        condition: service_healthy
      loan-service:
        condition: service_healthy

  registration-service:
    build: ./registration-service
    image: vnak3/registration-service:v1.0
    init: true
    env_file: ./registration-service/.env
    ports:
      - "3001:3001" # local only: to demo "Direct access is not allowed"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s # time to connect to Atlas

  login-service:
    build: ./login-service
    image: vnak3/login-service:v1.0
    init: true
    env_file: ./login-service/.env
    ports:
      - "3002:3002" # local only: to demo "Direct access is not allowed"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Two replicas of the same equipment image. They publish no ports, so the only way in
  # is through the load balancer.
  equipment-1:
    build: ./equipment-service
    image: vnak3/equipment-service:v1.0
    init: true
    env_file: ./equipment-service/.env
    environment:
      INSTANCE_ID: equipment-1 # not a secret, so it's set here; shows up in every response
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  equipment-2:
    # Same image as equipment-1, built once by equipment-1. "never" stops compose from
    # pulling an older copy from Docker Hub instead.
    image: vnak3/equipment-service:v1.0
    pull_policy: never
    init: true
    env_file: ./equipment-service/.env
    environment:
      INSTANCE_ID: equipment-2
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # nginx load balancer in front of the two replicas (round robin)
  equipment-lb:
    build: ./nginx
    image: vnak3/equipment-lb:v1.0
    init: true
    ports:
      - "8080:8080" # local only: equipment still refuses requests without the internal key
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      # nginx looks up the replica names when it starts, so wait until both are healthy.
      # restart: true restarts nginx if a replica is recreated, so it finds the new container.
      equipment-1:
        condition: service_healthy
        restart: true
      equipment-2:
        condition: service_healthy
        restart: true

  loan-service:
    build: ./loan-service
    image: vnak3/loan-service:v1.0
    init: true
    env_file: ./loan-service/.env
    environment:
      EQUIPMENT_URL: http://equipment-lb:8080 # through the load balancer, never a replica
    ports:
      - "3004:3004" # local only: to demo "Direct access is not allowed"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      equipment-lb:
        condition: service_healthy
