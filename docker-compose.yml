services:
  gateway:
    build: ./gateway
    image: vnak3/gateway:v1.0
    init: true
    env_file: ./gateway/.env
    environment:
      REGISTRATION_URL: http://registration-service:3001
      LOGIN_URL: http://login-service:3002
      EQUIPMENT_URL: http://equipment-lb:8080
      LOAN_URL: http://loan-service:3004
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      registration-service:
        condition: service_healthy
      login-service:
        condition: service_healthy
      equipment-lb:
        condition: service_healthy
      loan-service:
        condition: service_healthy

  registration-service:
    build: ./registration-service
    image: vnak3/registration-service:v1.0
    init: true
    env_file: ./registration-service/.env
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  login-service:
    build: ./login-service
    image: vnak3/login-service:v1.0
    init: true
    env_file: ./login-service/.env
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  equipment-1:
    build: ./equipment-service
    image: vnak3/equipment-service:v1.0
    init: true
    env_file: ./equipment-service/.env
    environment:
      INSTANCE_ID: equipment-1
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  equipment-2:
    image: vnak3/equipment-service:v1.0
    pull_policy: never
    init: true
    env_file: ./equipment-service/.env
    environment:
      INSTANCE_ID: equipment-2
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  equipment-lb:
    build: ./nginx
    image: vnak3/equipment-lb:v1.0
    init: true
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      equipment-1:
        condition: service_healthy
        restart: true
      equipment-2:
        condition: service_healthy
        restart: true

  loan-service:
    build: ./loan-service
    image: vnak3/loan-service:v1.0
    init: true
    env_file: ./loan-service/.env
    environment:
      EQUIPMENT_URL: http://equipment-lb:8080
    ports:
      - "3004:3004"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      equipment-lb:
        condition: service_healthy
