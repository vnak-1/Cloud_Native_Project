# Load balancer for the equipment service. nginx receives every equipment request on port
# 8080 and hands it to one of the two replicas, taking turns (round robin).
# This file replaces nginx's default site config (see the Dockerfile).

# One log line per request that also shows which replica answered ($upstream_addr)
log_format balanced '$remote_addr "$request" $status -> $upstream_addr';

upstream equipment_replicas {
    # Shared memory, so all nginx worker processes share one turn order. Without it each
    # worker keeps its own, and two requests in a row could land on the same replica.
    zone equipment_replicas 64k;

    # The two replicas, by their compose service names (Docker's DNS turns them into IPs).
    # No balancing method is named, so nginx uses round robin: requests alternate.
    server equipment-1:3003;
    server equipment-2:3003;
}

server {
    listen 8080;
    access_log /var/log/nginx/access.log balanced;

    # nginx's own health check for Docker. It doesn't touch the replicas, so health checks
    # don't use up turns in the round robin.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Everything else goes to the replicas
    location / {
        proxy_pass http://equipment_replicas;

        # Tell the replica the original host and who called
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Give up on an unresponsive replica quickly. nginx then retries the request on the
        # other replica, except POST and PATCH, which it never sends twice (they change data).
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }
}
