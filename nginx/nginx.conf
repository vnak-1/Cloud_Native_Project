log_format balanced '$remote_addr "$request" $status -> $upstream_addr';

upstream equipment_replicas {
    zone equipment_replicas 64k;

    server equipment-1:3003;
    server equipment-2:3003;
}

server {
    listen 8080;
    access_log /var/log/nginx/access.log balanced;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://equipment_replicas;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }
}
